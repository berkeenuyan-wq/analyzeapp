<!-- @dsCard group="Colors" viewport="700x170" name="Signal colors" subtitle="Meaning only: in tolerance, approaching, over threshold, no verdict" -->
<!doctype html><html lang="tr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-app);font:var(--type-body);color:var(--text-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="border-radius:var(--radius-md);background:var(--signal-good-tint);border:1px solid var(--signal-good-border);padding:12px"><div style="width:26px;height:26px;border-radius:50%;background:var(--signal-good)"></div><div style="margin-top:10px;font:var(--type-label);color:var(--signal-good)">--signal-good</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-subtle);margin-top:2px">Tolerans içinde</div></div>
<div style="border-radius:var(--radius-md);background:var(--signal-caution-tint);border:1px solid var(--signal-caution-border);padding:12px"><div style="width:26px;height:26px;border-radius:50%;background:var(--signal-caution)"></div><div style="margin-top:10px;font:var(--type-label);color:var(--signal-caution)">--signal-caution</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-subtle);margin-top:2px">Sınıra yaklaşıyor</div></div>
<div style="border-radius:var(--radius-md);background:var(--signal-bad-tint);border:1px solid var(--signal-bad-border);padding:12px"><div style="width:26px;height:26px;border-radius:50%;background:var(--signal-bad)"></div><div style="margin-top:10px;font:var(--type-label);color:var(--signal-bad)">--signal-bad</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-subtle);margin-top:2px">Eşik aşıldı (&gt;±5%)</div></div>
<div style="border-radius:var(--radius-md);background:var(--signal-neutral-tint);border:1px solid var(--signal-neutral-border);padding:12px"><div style="width:26px;height:26px;border-radius:50%;background:var(--signal-neutral)"></div><div style="margin-top:10px;font:var(--type-label);color:var(--signal-neutral)">--signal-neutral</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-subtle);margin-top:2px">Durum, yargı yok</div></div>
</div></body></html>
