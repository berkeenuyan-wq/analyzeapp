<!doctype html><html lang="tr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-app);font:var(--type-body);color:var(--text-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:14px;background:var(--surface-card)"><div style="font:var(--type-label);color:var(--text-muted)">--border-subtle</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-subtle);margin-top:4px">Tablo satırı, ayırıcı, nav kenarı</div></div>
