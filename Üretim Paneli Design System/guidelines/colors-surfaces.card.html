<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Near-black stack: page, nav, card, inset, raised" -->
<!doctype html><html lang="tr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-app);font:var(--type-body);color:var(--text-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div><div style="height:56px;border-radius:var(--radius-md);background:var(--bg-app);border:1px solid var(--border-subtle)"></div><div style="margin-top:8px;font:var(--type-label);color:var(--text-muted)">--bg-app</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-disabled)">#0b0b0e</div></div>
<div><div style="height:56px;border-radius:var(--radius-md);background:var(--bg-nav);border:1px solid var(--border-subtle)"></div><div style="margin-top:8px;font:var(--type-label);color:var(--text-muted)">--bg-nav</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-disabled)">#0e0e12</div></div>
<div><div style="height:56px;border-radius:var(--radius-md);background:var(--surface-card);border:1px solid var(--border-card);box-shadow:var(--shadow-card)"></div><div style="margin-top:8px;font:var(--type-label);color:var(--text-muted)">--surface-card</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-disabled)">#121216</div></div>
<div><div style="height:56px;border-radius:var(--radius-md);background:var(--surface-inset);border:1px solid var(--border-subtle)"></div><div style="margin-top:8px;font:var(--type-label);color:var(--text-muted)">--surface-inset</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-disabled)">#17171c</div></div>
<div><div style="height:56px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--border-subtle)"></div><div style="margin-top:8px;font:var(--type-label);color:var(--text-muted)">--surface-raised</div><div style="font:var(--type-caption);font-size:var(--text-2xs);color:var(--text-disabled)">#1d1d23</div></div>
</div></body></html>
