<!-- @dsCard group="Colors" viewport="700x170" name="Light theme parity" subtitle="Same aliases, re-pointed under [data-theme=light]" -->
<!doctype html><html lang="tr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-app);font:var(--type-body);color:var(--text-body)}</style></head><body style="padding:0"><div style="display:grid;grid-template-columns:1fr 1fr;height:100%;min-height:134px">
<div data-theme="dark" style="background:var(--bg-app);padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="font:var(--type-overline);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-subtle)">Dark (varsayılan)</div>
<div style="background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:12px"><div style="font:var(--type-caption);font-size:var(--text-xs);color:var(--text-muted)">Posa oranı</div><div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><span style="font:var(--type-metric);font-size:26px;color:var(--text-primary);letter-spacing:var(--tracking-metric)">4,1%</span><span style="font:var(--type-label);color:var(--signal-good);background:var(--signal-good-tint);border-radius:999px;padding:2px 7px">−0,6</span></div></div>
<button style="height:32px;border:none;border-radius:var(--radius-control);background:var(--action-primary-bg);color:var(--text-on-accent);font:var(--type-label);font-size:var(--text-sm)">Kaydet</button>
</div>
<div data-theme="light" style="background:var(--bg-app);padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="font:var(--type-overline);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-subtle)">Light</div>
<div style="background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:12px"><div style="font:var(--type-caption);font-size:var(--text-xs);color:var(--text-muted)">Posa oranı</div><div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><span style="font:var(--type-metric);font-size:26px;color:var(--text-primary);letter-spacing:var(--tracking-metric)">4,1%</span><span style="font:var(--type-label);color:var(--signal-good);background:var(--signal-good-tint);border-radius:999px;padding:2px 7px">−0,6</span></div></div>
<button style="height:32px;border:none;border-radius:var(--radius-control);background:var(--action-primary-bg);color:var(--text-on-accent);font:var(--type-label);font-size:var(--text-sm)">Kaydet</button>
</div>
</div></body></html>
