<!doctype html><html lang="tr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-app);font:var(--type-body);color:var(--text-body)}</style></head><body><div style="display:flex;gap:10px;align-items:stretch">

<div style="flex:1;border-radius:var(--radius-md);background:var(--accent-tint-08);border:1px solid var(--accent-tint-24);display:flex;align-items:flex-end;padding:10px"><span style="font:var(--type-label);font-size:var(--text-2xs);color:var(--accent-bright)">tint-08</span></div>
</div></body></html>
