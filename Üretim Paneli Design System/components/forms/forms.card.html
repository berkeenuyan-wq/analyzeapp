<!doctype html><html lang="tr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px 20px;background:var(--bg-app);font:var(--type-body);color:var(--text-body)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-overline);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-disabled)}</style></head><body><div id="root"></div><script type="text/babel">
const { Field, TextInput, Select, Checkbox, Switch, SegmentedControl, FormGrid } = window.RetimPaneliDesignSystem_b437a5;
const { Button } = window.RetimPaneliDesignSystem_b437a5;
function Demo(){
  const [g,setG]=React.useState("Günlük"); const [ok,setOk]=React.useState(true); const [auto,setAuto]=React.useState(true);
  return(<div className="col">
    <div className="row"><SegmentedControl value={g} onChange={setG} options={["Günlük","Haftalık","Aylık"]} /><SegmentedControl size="sm" value="p1" onChange={()=>{}} options={[{value:"p1",label:"Pres 1",icon:"gauge"},{value:"p2",label:"Pres 2",icon:"gauge"}]} /><Switch id="a" checked={auto} onChange={setAuto} label="Otomatik yenileme" /></div>
    <FormGrid columns={3}>
      <Field label="Tarih" required htmlFor="d"><TextInput id="d" type="date" defaultValue="2026-09-12" /></Field>
      <Field label="Vardiya" required><Select value="Vardiya 2" onChange={()=>{}} options={["Vardiya 1","Vardiya 2","Vardiya 3"]} icon="clock" /></Field>
      <Field label="Pres"><Select value="" onChange={()=>{}} placeholder="Pres seçin" options={["Pres 1","Pres 2"]} icon="factory" /></Field>
      <Field label="Araç plakası" required hint="Örn. 35 ABC 123"><TextInput icon="truck" placeholder="35 ABC 123" /></Field>
      <Field label="Brüt tonaj" required><TextInput type="number" defaultValue="28.40" suffix="ton" /></Field>
      <Field label="Preslenen" required error="Brüt tonajdan büyük olamaz"><TextInput type="number" defaultValue="31.05" suffix="ton" invalid /></Field>
    </FormGrid>
    <div className="row" style={{justifyContent:"space-between"}}>
      <Checkbox id="c" checked={ok} onChange={setOk} label="Kaydı onaylıyorum" description="Veriler uretim.xlsx dosyasına yazılır." />
      <div className="row"><Button>İptal</Button><Button variant="primary" icon="save">Kaydet</Button></div>
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
