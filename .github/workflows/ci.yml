name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock.txt
          pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Mypy
        run: mypy
      - name: Pytest (incl. metric baseline)
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Electron's Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libasound2t64 libnss3 libgtk-3-0
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements.lock.txt
      - name: Install electron
        working-directory: electron
        run: npm ci
      - name: Fix chrome-sandbox perms (Linux needs root:root 4755)
        working-directory: electron
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Typecheck + lint
        working-directory: electron
        run: |
          npm run typecheck
          npm run lint
      - name: Build
        working-directory: electron
        run: npm run build
      - name: Sidecar lifecycle / no-orphan guard
        working-directory: electron
        run: xvfb-run --auto-servernum ./node_modules/.bin/electron dist/smoke.js
